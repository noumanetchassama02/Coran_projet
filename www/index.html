<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coran — Lecture, écoute &amp; mémorisation</title>
  <meta name="description" content="Lire, écouter et mémoriser le Coran : 114 sourates, plusieurs récitateurs, lecture synchronisée, mode hors ligne et favoris.">
  <meta name="theme-color" content="#0B3D2E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <header class="app-header">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="38" height="38" class="brand-logo">
        <div class="brand-text">
          <h1>Coran</h1>
          <p>Lecture · Écoute · Mémorisation</p>
        </div>
      </div>
      <button id="resume-btn" class="resume-btn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Reprendre</span>
      </button>
    </header>

    <main id="view-root" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <button class="tab-btn is-active" data-tab="surahs" aria-label="Sourates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Sourates</span>
      </button>
      <button class="tab-btn" data-tab="search" aria-label="Recherche">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Recherche</span>
      </button>
      <button class="tab-btn" data-tab="favorites" aria-label="Favoris">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>Favoris</span>
      </button>
      <button class="tab-btn" data-tab="settings" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span>Réglages</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
